[package]
name = "chain-wallet"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Blockchain assessment wallet with local chain, Ethereum RPC, and Bitcoin helpers"
license = "MIT"
readme = "../README.md"
exclude = [
    "target/**",
    "target*/**",
    "*.exe",
    "*.pdb",
]

[lib]
name = "chain_wallet_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "chain-wallet"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bip32 = { version = "0.5", features = ["secp256k1"] }
bip39 = "2.2"
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
python = ["dep:pyo3"]
