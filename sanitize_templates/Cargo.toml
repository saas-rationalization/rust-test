[package]
name = "chain-wallet"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Simple blockchain-style wallet library with CLI"
license = "MIT"
readme = "README.md"
exclude = [
    "target/**",
    "target*/**",
    "*.exe",
    "*.pdb",
]

[lib]
name = "chain_wallet"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "chain-wallet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
rand = "0.8"
sha2 = "0.10"
thiserror = "2.0"

[features]
default = []
python = ["dep:pyo3"]

[profile.release]
strip = true
lto = true
codegen-units = 1
